<div class="login-container">
    <div class="form-lado">
        <div class="form-container">
        <div class="header-form-login">
            <h2>Esqueceu a senha?</h2>
            <h4>Digite um email e enviaremos um código para verificar sua identidade.</h4>
        </div>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn-custom">Enviar</button>
            </div>

            <div id="text-cadastro">
                <a href="login" id="link-cadastro">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                </svg>
                Voltar ao login</a>
            </div>
        </form>

        </div>
    </div>
</div>
